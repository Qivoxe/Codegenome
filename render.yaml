services:
  - type: web
    name: codegenome-api
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./codegenome.db
      - key: GITHUB_WEBHOOK_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.0
