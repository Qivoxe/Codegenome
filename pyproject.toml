[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codegenome"
version = "0.1.0"
description = "Deep-tech software intelligence platform for predicting code change impact"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "networkx>=3.0",
    "gitpython>=3.1",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "pandas>=2.0",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "mypy>=1.0",
    "ruff>=0.1",
]

[project.scripts]
codegenome = "backend.app.main:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.setuptools.packages.find]
include = ["codegenome*"]
